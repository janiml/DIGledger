<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16202b;
    --paper:#f6f5f1;
    --paper-raised:#ffffff;
    --line:#d8d4c8;
    --teal:#0d6e74;
    --teal-deep:#0a4f54;
    --amber:#c4791f;
    --muted:#6b7280;
    --danger:#a3402f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:760px;margin:0 auto;
    padding:calc(28px + env(safe-area-inset-top)) 20px calc(80px + env(safe-area-inset-bottom));
  }

  /* Header / ledger spine */
  header{
    border-bottom:3px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:22px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
  }
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--teal-deep);
  }
  .brand h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .date-control{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .date-control label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  input[type="date"]{
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    padding:6px 8px;
    border:1.5px solid var(--ink);
    background:var(--paper-raised);
    color:var(--ink);
    border-radius:3px;
  }

  /* Total tally */
  .tally{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    background:var(--ink);
    color:var(--paper);
    border-radius:6px;
    padding:18px 22px;
    margin-bottom:22px;
  }
  .tally .label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#b9c2c6;}
  .tally .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8fa3a6;margin-top:4px;}
  .tally .num{font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:700;line-height:1;color:#fff;}
  .tally .num span{font-size:18px;color:#8fa3a6;font-weight:500;margin-left:6px;}

  /* Add row */
  .add-card{
    background:var(--paper-raised);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:16px;
    margin-bottom:24px;
  }
  .add-card .row{display:flex;gap:10px;flex-wrap:wrap;}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:160px;}
  .field.qty{flex:0 0 84px;min-width:84px;}
  .field.pts{flex:0 0 96px;min-width:96px;}
  label.fl{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  select,input[type="text"],input[type="number"]{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:16px;
    padding:9px 10px;
    border:1.5px solid var(--line);
    border-radius:5px;
    background:#fff;
    color:var(--ink);
  }
  select:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
  .pts input{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .add-card .row2{display:flex;gap:10px;margin-top:10px;align-items:flex-end;}
  button{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
    border-radius:5px;
    cursor:pointer;
    border:none;
  }
  .btn-add{
    background:var(--teal);
    color:#fff;
    padding:10px 18px;
    white-space:nowrap;
  }
  .btn-add:hover{background:var(--teal-deep);}
  .custom-toggle{
    background:none;
    border:1.5px dashed var(--line);
    color:var(--muted);
    padding:9px 12px;
    font-size:12px;
  }
  .custom-toggle:hover{border-color:var(--teal);color:var(--teal-deep);}
  .hidden{display:none !important;}

  /* Entries */
  .entries{display:flex;flex-direction:column;gap:8px;margin-bottom:30px;}
  .entry{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--teal);
    border-radius:5px;
    padding:11px 14px;
  }
  .entry .name{flex:1;font-size:14px;font-weight:500;}
  .entry .meta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
  .entry .sub{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;color:var(--teal-deep);min-width:38px;text-align:right;}
  .entry .rm{background:none;color:var(--danger);font-size:16px;padding:2px 6px;line-height:1;}
  .entry .rm:hover{background:#f3e3df;border-radius:4px;}
  .empty-state{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:var(--muted);
    text-align:center;
    padding:30px 10px;
    border:1.5px dashed var(--line);
    border-radius:8px;
  }

  /* History */
  .history h2{
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:10px;
  }
  .hist-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-size:13px;
  }
  .hist-row:hover{background:#efece2;}
  .hist-row .d{font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  .hist-row .t{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--teal-deep);}
  .hist-row.active{background:#e4f0ef;border-left:3px solid var(--teal);padding-left:7px;}

  .status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);text-align:right;margin-top:6px;min-height:14px;}

  /* Scan / camera */
  .scan-card{
    background:var(--ink);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:22px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .scan-card .txt{flex:1;}
  .scan-card .txt h3{margin:0 0 2px;color:#fff;font-size:14px;font-weight:600;}
  .scan-card .txt p{margin:0;color:#9aa7ab;font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .btn-scan{
    background:var(--amber);
    color:#fff;
    padding:11px 16px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-shrink:0;
  }
  .btn-scan:hover{background:#a8651a;}
  .btn-scan svg{width:18px;height:18px;}

  .scan-overlay{
    position:fixed;inset:0;
    background:rgba(15,18,22,.6);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .scan-sheet{
    background:var(--paper);
    width:100%;max-width:760px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .scan-sheet h2{margin:0 0 4px;font-size:17px;}
  .scan-sheet .sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:16px;}
  .scan-loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 10px;}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--teal);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .scan-loading .lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}

  .scan-match{
    display:flex;align-items:center;gap:10px;
    background:var(--paper-raised);border:1px solid var(--line);border-left:4px solid var(--teal);
    border-radius:5px;padding:10px 12px;margin-bottom:7px;
  }
  .scan-match .info{flex:1;min-width:0;}
  .scan-match .info .nm{font-size:13.5px;font-weight:500;}
  .scan-match .info .raw{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stepper{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;}
  .stepper button{background:var(--paper);border:1px solid var(--line);width:24px;height:24px;border-radius:4px;font-size:14px;color:var(--ink);}
  .scan-match .pts{font-weight:700;color:var(--teal-deep);min-width:30px;text-align:right;font-family:'IBM Plex Mono',monospace;}
  .scan-match .rm2{background:none;color:var(--danger);font-size:15px;padding:2px 4px;}

  .unmatched-box{
    border:1.5px dashed var(--line);border-radius:8px;padding:10px 12px;margin:14px 0;
  }
  .unmatched-box summary{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);cursor:pointer;letter-spacing:.05em;text-transform:uppercase;}
  .unmatched-box .ul-line{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#8a8478;padding:4px 0;border-top:1px solid var(--line);}

  .scan-actions{display:flex;gap:10px;margin-top:16px;}
  .btn-confirm{background:var(--teal);color:#fff;padding:12px;flex:1;font-size:13.5px;}
  .btn-cancel{background:none;border:1.5px solid var(--line);color:var(--muted);padding:12px 16px;}
  .empty-scan{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);text-align:center;padding:20px 6px;}
</style>
</head>
<body>
<div class="wrap">

  <header>

<script>
const POINT_TABLE = [

  [2, ["Xray Bilateral","CT Head","US Body","US Breast","Nuc Med (general)","CT Cardiac Calcium Score"]],
  [3, ["Xray Bone Survey","CT Spine","CT Pelvis","CT Face","CT Orbits","CT Sinus","CT Head Perfusion","CT Head W/ and W/O","US Thyroid","US Pelvis","US Pregnancy","US Scrotum","US Arterial","Stroke CT","Fluoro done by PA"]],
  [4, ["Screening Mammo","Mammo Addendum (another)"]],
  [5, ["CT Chest","CT Abd","CT Abd & Pelv","CT PE","CT Neck","CT IAC","CT TEVAR","CT Myelogram","CT Spine W/ and W/O","CT Orbits W/ and W/O","MR Body","MR Brain","MR Joint","MR Spine","Fluoro done by Physician","Nuc Med Octreoscan","Nuc Med Renal Lasix Washout","Nuc Med Gallium","Paracentesis","Thoracentesis"]],

const examSelect = document.getElementById('examSelect');
POINT_TABLE.forEach(([pts, names])=>{
  const group = document.createElement('optgroup');
  group.label = pts + ' point' + (pts===1?'':'s');
  names.forEach(n=>{
    const opt = document.createElement('option');
    opt.value = JSON.stringify({name:n, pts});
    opt.textContent = n;
    group.appendChild(opt);
  });
  examSelect.appendChild(group);
});

const dateInput = document.getElementById('dateInput');
// Local storage adapter — works fully offline/standalone once downloaded.
// (Replaces Claude's artifact-only window.storage API, which doesn't exist outside claude.ai.)
const LocalStore = {
  PREFIX: 'reading-ledger::',
  async get(key){
    const raw = localStorage.getItem(this.PREFIX + key);
    return raw === null ? null : { key, value: raw };
  },
  async set(key, value){
    localStorage.setItem(this.PREFIX + key, value);
    return { key, value };
  },
  async list(prefix){
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.startsWith(this.PREFIX)){
        const stripped = k.slice(this.PREFIX.length);
        if(!prefix || stripped.startsWith(prefix)) keys.push(stripped);
      }
    }
    return { keys };
  }
};
const qtyInput = document.getElementById('qtyInput');
const addBtn = document.getElementById('addBtn');
const customToggle = document.getElementById('customToggle');
const presetField = document.getElementById('presetField');

const statusLine = document.getElementById('statusLine');

let customMode = false;
let currentDate = todayStr();
let currentEntries = [];

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function keyFor(dateStr){ return 'log:' + dateStr; }

function setStatus(msg){
  statusLine.textContent = msg;
  if(msg) setTimeout(()=>{ if(statusLine.textContent===msg) statusLine.textContent=''; }, 1800);
}

customToggle.addEventListener('click', ()=>{
  customMode = !customMode;
  presetField.classList.toggle('hidden', customMode);
  customNameField.style.display = customMode ? 'flex' : 'none';
  customPtsField.style.display = customMode ? 'flex' : 'none';
  customToggle.textContent = customMode ? 'Use exam list instead' : 'Custom exam / points';
});

async function loadDate(dateStr){
  currentDate = dateStr;
  dateInput.value = dateStr;
  try{
    const res = await LocalStore.get(keyFor(dateStr));
    currentEntries = res ? JSON.parse(res.value) : [];
  }catch(e){
    currentEntries = [];
  }
  renderEntries();
  await renderHistory();
}

async function saveCurrent(){
  try{
    await LocalStore.set(keyFor(currentDate), JSON.stringify(currentEntries));
  }catch(e){
    setStatus('Could not save — try again');
  }
}

function renderEntries(){
  entriesEl.innerHTML = '';
  if(currentEntries.length === 0){
    entriesEl.innerHTML = '<div class="empty-state">No exams logged for this date yet.</div>';
  } else {
    currentEntries.forEach((e, idx)=>{
      const row = document.createElement('div');
      row.className = 'entry';
      row.innerHTML = `
        <div class="name">${escapeHtml(e.name)}</div>
        <div class="meta">${e.pts} pt × ${e.qty}</div>
        <div class="sub">${e.pts * e.qty}</div>
        <button class="rm" data-idx="${idx}" title="Remove">✕</button>
      `;
      entriesEl.appendChild(row);
    });
  }
  const total = currentEntries.reduce((s,e)=>s + e.pts*e.qty, 0);
  const examTotal = currentEntries.reduce((s,e)=>s + e.qty, 0);
  totalPointsEl.innerHTML = total + '<span>pts</span>';
  examCountEl.textContent = examTotal + ' exam' + (examTotal===1?'':'s') + ' logged';

  entriesEl.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const i = parseInt(btn.dataset.idx,10);
      currentEntries.splice(i,1);
      await saveCurrent();
      renderEntries();
      await renderHistory();
    });
  });
}

async function renderHistory(){
  historyListEl.innerHTML = '';
  let keys = [];
  try{
    const res = await LocalStore.list('log:');
    keys = res ? res.keys : [];
  }catch(e){
    keys = [];
  }
  const dates = keys.map(k=>k.replace('log:','')).sort().reverse();
  if(dates.length === 0){
    historyListEl.innerHTML = '<div class="empty-state">No history yet — entries you log will appear here.</div>';
    return;
  }
  for(const d of dates){
    let entries = [];
    try{
      const res = await LocalStore.get(keyFor(d));
      entries = res ? JSON.parse(res.value) : [];
    }catch(e){ entries = []; }
    const total = entries.reduce((s,e)=>s + e.pts*e.qty, 0);
    const row = document.createElement('div');
    row.className = 'hist-row' + (d===currentDate ? ' active' : '');
    row.innerHTML = `<span class="d">${formatDate(d)}</span><span class="t">${total} pts</span>`;
    row.addEventListener('click', ()=> loadDate(d));
    historyListEl.appendChild(row);
  }
}

function formatDate(dStr){
  const [y,m,d] = dStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return dt.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

addBtn.addEventListener('click', async ()=>{
  const qty = Math.max(1, parseInt(qtyInput.value,10) || 1);
  let name, pts;
  if(customMode){
    name = customName.value.trim();
    pts = parseInt(customPts.value,10);
    if(!name){ setStatus('Enter an exam name'); return; }
    if(!pts || pts < 1){ setStatus('Enter a point value'); return; }
  } else {
    if(!examSelect.value){ setStatus('Select an exam'); return; }
    const parsed = JSON.parse(examSelect.value);
    name = parsed.name;
    pts = parsed.pts;
  }
  const existing = currentEntries.find(e=> e.name===name && e.pts===pts);
  if(existing){
    existing.qty += qty;
  } else {
    currentEntries.push({name, pts, qty});
  }
  await saveCurrent();
  renderEntries();
  await renderHistory();
  setStatus('Added');
  customName.value = '';
  customPts.value = '';
  qtyInput.value = 1;
});

  {pts:7, label:'CT Abd & Pelv W/ and W/O', re:/CT\s*ABD.*PELV.*W\s*\/?\s*AND\s*W\s*\/?\s*O/},
  {pts:7, label:'CT Urogram', re:/UROGRAM/},
  {pts:7, label:'CT Extremity W/ and W/O', re:/EXTREMITY.*W\s*\/?\s*AND\s*W\s*\/?\s*O/},
  {pts:7, label:'CT Hi-Res Chest', re:/HI\s*-?\s*RES.*CHEST/},
  {pts:7, label:'CTA Abd/Pelv', re:/CTA.*ABD.*PELV/},
  {pts:7, label:'CTA GI Bleed', re:/GI\s*BLEED/},
  {pts:7, label:'CTA Upper Extremity', re:/CTA.*UPPER\s*EXTREMITY/},
  {pts:7, label:'CTA Watchman', re:/WATCHMAN/},
  {pts:7, label:'MG Diagnostic', re:/(MM|MG)\s*DIAGNOSTIC|DIAGNOSTIC\s*MAMMO/},

  {pts:7, label:'MR Brachial Plexus', re:/BRACH.*PLEX/},

  {pts:12, label:'CT Angio TAVR Protocol', re:/TAVR/},
  {pts:5, label:'CT TEVAR', re:/TEVAR/},
  {pts:5, label:'CT Myelogram', re:/MYELOGRAM/},
  {pts:5, label:'CT Spine W/ and W/O', re:/CT\s*SPINE.*W\s*\/?\s*AND\s*W\s*\/?\s*O/},
  {pts:5, label:'CT Orbits W/ and W/O', re:/ORBIT.*W\s*\/?\s*AND\s*W\s*\/?\s*O/},
  {pts:5, label:'MR Body', re:/MR\s*BODY/},
  {pts:5, label:'MR Brain', re:/MR\s*(HEAD\s*\/?\s*BRAIN|BRAIN)/},

  {pts:4, label:'Screening / Tomo Mammo', re:/(SCREENING\s*MAMMO|TOMO\s*SCREENING|MM\s*SCREENING)/},

  {pts:2, label:'Xray Bilateral', re:/X\s*-?\s*RAY.*BILATERAL/},
  {pts:2, label:'CT Head', re:/CT\s*HEAD\s*\/?\s*BRAIN|CT\s*HEAD\b/},
  {pts:2, label:'US Body', re:/US\s*BODY/},

  {pts:1, label:'US DVT', re:/\bDVT\b/},
  {pts:1, label:'US Aorta', re:/US\s*AORTA/},
  {pts:1, label:'US Vein Mapping', re:/VEIN\s*MAP/},

  {pts:1, label:'CT Orbits for Metal', re:/ORBIT.*METAL/},
  {pts:1, label:'Mammo Addendum', re:/MAMMO\s*ADDENDUM/},
  {pts:1, label:'MM Post Biopsy', re:/(MM|MAMMO)\s*POST\s*BIOPSY/},
  {pts:1, label:'Xray', re:/X\s*-?\s*RAY/},
];

// Lines that are clearly not exam descriptions (dates, accession numbers,
// status words, column headers) — skipped so they don't clutter "unmatched".
const NOISE_RE = /^\s*$|^\d{1,2}\/\d{1,2}\/\d{2,4}|accession|complete|signed|normal|stat\b|jani|patient|mrn|^\(.*\)$|reports?\s*\/|advanced search|action$|^\d+$/i;

function matchScanText(rawText){
  const lines = rawText.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const matches = {}; // key: label -> {label, pts, qty, raw}
  const unmatched = [];
  for(const line of lines){
    // Some RIS exports spell out "CT ANGIO X" instead of "CTA X" — normalize
    // so the CTA-prefixed rules below still catch these.
    const upper = line.toUpperCase().replace(/CT\s*ANGIO\b/g, 'CTA');
    let hit = null;
    for(const rule of SCAN_RULES){
      if(rule.re.test(upper)){ hit = rule; break; }
    }
    if(hit){
      const key = hit.label + '|' + hit.pts;
      if(!matches[key]) matches[key] = {label:hit.label, pts:hit.pts, qty:0, raw:line};
      matches[key].qty += 1;
    } else if(!NOISE_RE.test(line) && /[A-Za-z]{3}/.test(line)) {
      // only keep alphabetic, non-noise lines as "unmatched" candidates
      unmatched.push(line);
    }
  }
  return { results: Object.values(matches), unmatched };
}

const scanBtn = document.getElementById('scanBtn');

async function runDiagnostics(){
  scanOverlay.classList.remove('hidden');
  scanTitle.textContent = 'Checking your browser…';
  scanSub.textContent = 'Testing each piece the scanner needs';
  scanBody.innerHTML = `<div class="scan-loading"><div class="spinner"></div><div class="lbl">Running checks…</div></div>`;

  const rows = [];
  const add = (label, ok, note)=> rows.push({label, ok, note});

  add('Page address', window.location.protocol !== 'file:', window.location.protocol === 'file:' ? 'Opened as a local file — this alone can block scanning. Open from a real web link instead.' : window.location.href.slice(0,60));

  const hasWorker = typeof Worker !== 'undefined';
  add('Background worker support', hasWorker, hasWorker ? 'available' : 'not available in this browser view');

  const hasWasm = typeof WebAssembly !== 'undefined';
  add('WebAssembly support', hasWasm, hasWasm ? 'available' : 'not available in this browser view');

  let workerCreates = false, workerErr = '';
  if(hasWorker){
    try{
      const blob = new Blob(['self.postMessage("ok");'], {type:'application/javascript'});
      const url = URL.createObjectURL(blob);
      await new Promise((resolve, reject)=>{
        const w = new Worker(url);
        const t = setTimeout(()=>{ w.terminate(); reject(new Error('timed out')); }, 3000);
        w.onmessage = ()=>{ clearTimeout(t); workerCreates = true; w.terminate(); resolve(); };
        w.onerror = (e)=>{ clearTimeout(t); reject(e); };
      });
    }catch(e){ workerErr = (e && e.message) ? e.message : 'blocked'; }
  }
  add('Can actually start a worker', workerCreates, workerCreates ? 'yes' : ('blocked — ' + (workerErr||'unknown reason')));

  let cdnOk = false, cdnErr = '';
  try{
    const res = await fetch('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js', {method:'HEAD'});
    cdnOk = res.ok;
  }catch(e){ cdnErr = (e && e.message) ? e.message : 'network blocked'; }
  add('Can reach scan-engine files online', cdnOk, cdnOk ? 'yes' : ('blocked — ' + cdnErr));

  const allOk = rows.every(r=>r.ok);
  scanTitle.textContent = allOk ? 'Everything checks out' : 'Found the blocker';
  scanSub.textContent = allOk ? 'Scanning should work — try again' : 'This is what\'s stopping the scan';

  let html = '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:6px;">';
  rows.forEach(r=>{
    html += `<div style="display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:6px;background:${r.ok?'#eaf3ee':'#f7e9e6'};border-left:4px solid ${r.ok?'var(--teal)':'var(--danger)'};">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:${r.ok?'var(--teal-deep)':'var(--danger)'};">${r.ok?'OK':'FAIL'}</div>
      <div style="flex:1;">
        <div style="font-size:13px;font-weight:500;">${escapeHtml(r.label)}</div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px;">${escapeHtml(r.note)}</div>
      </div>
    </div>`;
  });
  html += '</div>';
  html += `<div class="scan-actions"><button class="btn-cancel" id="diagClose">Close</button></div>`;
  scanBody.innerHTML = html;
  document.getElementById('diagClose').addEventListener('click', closeScan);
}


scanInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  scanOverlay.classList.remove('hidden');
  scanTitle.textContent = 'Reading image…';
  scanSub.textContent = 'Running on-device text recognition';
  scanBody.innerHTML = `<div class="scan-loading"><div class="spinner"></div><div class="lbl" id="scanProgress">Starting…</div></div>`;

  try{
    const { data } = await Tesseract.recognize(file, 'eng', {
      workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
      corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core-simd.wasm.js',
      langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int',
      logger: (m)=>{
        const el = document.getElementById('scanProgress');
        if(el && m.status){
          const pct = m.progress ? ' ' + Math.round(m.progress*100) + '%' : '';
          el.textContent = m.status + pct;
        }
      }
    });
    const { results, unmatched } = matchScanText(data.text || '');
    pendingScanResults = results;
    renderScanReview(unmatched);
  }catch(err){
    const isLocalFile = window.location.protocol === 'file:';
    scanTitle.textContent = 'Scan failed';
    scanSub.textContent = '';
    let explanation;
    if(isLocalFile){
      explanation = `This usually isn't about the photo. The scanner needs a background process that Safari blocks when this page is opened as a downloaded local file. The fix is to open this tool from a real web link instead of the downloaded file — ask Claude for a published link, then "Add to Home Screen" from that link in Safari.`;
    } else {
      explanation = `The scan engine hit an error before it could read the image. You can try again, or try a different photo.`;
    }
    let detail = 'no error details were provided by the scan engine';
    try{
      if(err && err.message) detail = err.message;
      else if(err && err.name) detail = err.name;
      else if(typeof err === 'string' && err) detail = err;
      else if(err) detail = JSON.stringify(err);
    }catch(e){ /* keep default detail */ }
    scanBody.innerHTML = `<div class="empty-scan">${escapeHtml(explanation)}</div>
      <div class="empty-scan" style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#aaa;margin-top:8px;">Technical detail: ${escapeHtml(detail)}</div>
      <div class="scan-actions"><button class="btn-cancel" id="scanCloseErr">Close</button></div>`;
    document.getElementById('scanCloseErr').addEventListener('click', closeScan);
  }
  scanInput.value = '';
});

function renderScanReview(unmatched){
  scanTitle.textContent = pendingScanResults.length ? 'Review matches' : 'Nothing matched';
  scanSub.textContent = pendingScanResults.length
    ? 'Adjust counts, remove anything wrong, then add'
    : 'Try a clearer photo, or add exams manually';

  let html = '';
  if(pendingScanResults.length === 0){
    html += `<div class="empty-scan">No recognizable exam lines found.</div>`;
  } else {
    pendingScanResults.forEach((r, i)=>{
      html += `
        <div class="scan-match">
          <div class="info">
            <div class="nm">${escapeHtml(r.label)} <span style="color:var(--muted);font-weight:400;">· ${r.pts} pt</span></div>
            <div class="raw">from: "${escapeHtml(r.raw)}"</div>
          </div>
          <div class="stepper">
            <button data-act="dec" data-i="${i}">−</button>
            <span id="qty-${i}">${r.qty}</span>
            <button data-act="inc" data-i="${i}">+</button>
          </div>
          <div class="pts">${r.pts * r.qty}</div>
          <button class="rm2" data-act="rm" data-i="${i}">✕</button>
        </div>`;
    });
  }

  if(unmatched.length){
    html += `<details class="unmatched-box"><summary>${unmatched.length} line(s) not recognized</summary>`;
    unmatched.slice(0,30).forEach(u=>{
      html += `<div class="ul-line">${escapeHtml(u)}</div>`;
    });
    html += `</details>`;
  }

  html += `<div class="scan-actions">
      <button class="btn-cancel" id="scanCancel">Cancel</button>
      <button class="btn-confirm" id="scanConfirm" ${pendingScanResults.length ? '' : 'disabled style="opacity:.5;"'}>Add ${pendingScanResults.reduce((s,r)=>s+r.qty,0)} exam(s) to ledger</button>
    </div>`;

  scanBody.innerHTML = html;

  scanBody.querySelectorAll('[data-act="inc"]').forEach(b=> b.addEventListener('click', ()=>{
    const i = +b.dataset.i; pendingScanResults[i].qty++; renderScanReview(unmatched);
  }));
  scanBody.querySelectorAll('[data-act="dec"]').forEach(b=> b.addEventListener('click', ()=>{
    const i = +b.dataset.i;
    pendingScanResults[i].qty = Math.max(0, pendingScanResults[i].qty - 1);
    if(pendingScanResults[i].qty === 0) pendingScanResults.splice(i,1);
    renderScanReview(unmatched);
  }));
  scanBody.querySelectorAll('[data-act="rm"]').forEach(b=> b.addEventListener('click', ()=>{
    const i = +b.dataset.i; pendingScanResults.splice(i,1); renderScanReview(unmatched);
  }));
  const cancelBtn = document.getElementById('scanCancel');
  if(cancelBtn) cancelBtn.addEventListener('click', closeScan);
  const confirmBtn = document.getElementById('scanConfirm');
  if(confirmBtn) confirmBtn.addEventListener('click', commitScanResults);
}

async function commitScanResults(){
  pendingScanResults.forEach(r=>{
    if(r.qty <= 0) return;
    const existing = currentEntries.find(e=> e.name===r.label && e.pts===r.pts);
    if(existing) existing.qty += r.qty;
    else currentEntries.push({name:r.label, pts:r.pts, qty:r.qty});
  });
  await saveCurrent();
  renderEntries();
  await renderHistory();
  setStatus('Scan added to ledger');
  closeScan();
}

function closeScan(){
  scanOverlay.classList.add('hidden');
  pendingScanResults = [];
}

(async ()=>{
  await loadDate(todayStr());
})();
</script>
</body>
</html>
